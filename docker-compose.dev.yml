# ============================================================
# Tabulation System — Docker Compose (Development override)
# Runs only PostgreSQL in Docker; Nuxt runs on the host.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   npm run dev
# ============================================================

services:
  db:
    image: postgres:17-alpine
    container_name: tabulation_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: tabulation_db
      POSTGRES_USER: tabulation
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"          # exposed so host npm scripts can reach it
    volumes:
      - db_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabulation -d tabulation_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_dev_data:
    driver: local
